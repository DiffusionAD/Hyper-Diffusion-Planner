# Single modification entry for trajectory sampling.
#
# ``target`` is the (action_horizon, dt) of the future-trajectory **label**
# sampled inside the target builder. ``pdm`` is the (rollout horizon, dt) used
# by the PDM simulator + scorer at evaluation/RL time. Both are referenced by
# the agent YAMLs and by ``utils.build_pdm_components`` -- single source.

target:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

pdm:
  time_horizon: 4.0
  interval_length: 0.1
