hydra:
  run:
    dir: ./tmp
  output_subdir: null           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://hdp_navsim.config # find agent
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - train_test_split: ???
  - default_evaluation
  - agent: dp_vla_rl_agent
  - worker: ray_distributed_no_torch
  - _self_

train_val_test_log_split_path: hdp_navsim/config/training/default_train_val_test_log_split.json
split: trainval
cache_path: ${oc.env:HDP_NAVSIM_CACHE_PATH}
use_cache_without_dataset: true # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: false
seed: 0


# To the experimental folder level, automatically find the latest checkpoint
resume_checkpoint_path: null # /data/navsim/navsim-exp/transfuser_dit_agent/2025.03.09.14.44.50/full_train


save_epoch: 10


lightning_agent:
  params:
    lr: 1e-3
    total_epochs: 10000
    warmup_epochs: 10
    use_ema: false


dataloader:
  params:
    batch_size: 16  # number of samples per batch
    num_workers: 4  # number of workers for data loading
    pin_memory: true  # pin memory for faster GPU transfer
    prefetch_factor: 2  # number of samples loaded in advance by each worker


trainer:
  params:
    max_epochs: ${lightning_agent.params.total_epochs}  # maximum number of training epochs
    check_val_every_n_epoch: 10000000  # run validation set every n training epochs

    limit_train_batches: 1.0  # how much of training dataset to check (float = fraction, int = num_batches)
    limit_val_batches: 1  # how much of validation dataset to check (float = fraction, int = num_batches)

    accelerator: gpu  # distribution method
    # strategy: ddp_find_unused_parameters_true
    strategy: ddp
    precision: 16-mixed  # floating point precision
    num_nodes: ${oc.env:MLP_WORKER_NUM,1}

    num_sanity_val_steps: 0  # number of validation steps to run before training begins
    fast_dev_run: false  # runs 1 batch of train/val/test for sanity

    accumulate_grad_batches: 1  # accumulates gradients every n batches
    # track_grad_norm: -1  # logs the p-norm for inspection
    gradient_clip_val: 1.0  # value to clip gradients
    gradient_clip_algorithm: norm  # [value, norm] method to clip gradients
    default_root_dir: ${output_dir}

    log_every_n_steps: 1